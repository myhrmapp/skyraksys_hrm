name: CD - Deploy

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production

jobs:
  # Pre-deployment validation
  pre-deploy:
    name: Pre-Deployment Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Validate routes
        run: npm run validate:routes
      
      - name: Run pre-deployment checks
        run: npm run validate:deploy
      
      - name: Check environment variables (staging example)
        if: github.event.inputs.environment == 'staging' || github.ref == 'refs/heads/main'
        run: |
          echo "Checking staging environment variables..."
          # Add your environment variable checks here
  
  # Build
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: pre-deploy
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      
      - name: Build frontend
        run: cd frontend && npm run build
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
      
      - name: Create deployment package
        run: |
          mkdir -p deploy
          cp -r backend deploy/
          cp -r frontend/build deploy/frontend
          cp docker-compose.yml deploy/
          cp -r nginx deploy/
          cp -r scripts/deploy deploy/scripts/
          tar -czf deployment.tar.gz deploy
      
      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: deployment.tar.gz
          retention-days: 7
  
  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.event.inputs.environment == 'staging' || (github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/'))
    environment:
      name: staging
      url: https://staging.yourdomain.com
    
    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: deployment-package
      
      - name: Deploy to staging server
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_PATH"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/deploy_key deployment.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/skyraksys-release.tar.gz"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
            set -euo pipefail
            mkdir -p "$DEPLOY_PATH/releases"
            release="$DEPLOY_PATH/releases/$(date +%Y%m%d%H%M%S)"
            mkdir "$release"
            tar -xzf /tmp/skyraksys-release.tar.gz -C "$release" --strip-components=1
            cp "$DEPLOY_PATH/.env.production" "$release/.env.production"
            ln -sfn "$release" "$DEPLOY_PATH/current"
            cd "$DEPLOY_PATH/current"
            docker compose --env-file .env.production up -d --build
            bash scripts/deploy/run-migrations.sh
          REMOTE
      
      - name: Run health check
        run: |
          curl --retry 12 --retry-delay 5 --retry-connrefused -fsS https://staging.yourdomain.com/health
  
  # Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event.inputs.environment == 'production' || startsWith(github.ref, 'refs/tags/')
    environment:
      name: production
      url: https://yourdomain.com
    
    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: deployment-package
      
      - name: Create backup
        env:
          DEPLOY_HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_PATH"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
            set -euo pipefail
            mkdir -p "$DEPLOY_PATH/backups"
            cd "$DEPLOY_PATH/current"
            docker compose --env-file .env.production exec -T postgres pg_dump -U "${POSTGRES_USER:-postgres}" "${POSTGRES_DB:-skyraksys_hrm}" | gzip > "$DEPLOY_PATH/backups/db-$(date +%Y%m%d%H%M%S).sql.gz"
            readlink -f "$DEPLOY_PATH/current" > "$DEPLOY_PATH/backups/previous-release"
          REMOTE

      - name: Deploy to production server
        env:
          DEPLOY_HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
        run: |
          scp -i ~/.ssh/deploy_key deployment.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/skyraksys-release.tar.gz"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
            set -euo pipefail
            release="$DEPLOY_PATH/releases/$(date +%Y%m%d%H%M%S)"
            mkdir "$release"
            tar -xzf /tmp/skyraksys-release.tar.gz -C "$release" --strip-components=1
            cp "$DEPLOY_PATH/.env.production" "$release/.env.production"
            ln -sfn "$release" "$DEPLOY_PATH/current"
            cd "$DEPLOY_PATH/current"
            docker compose --env-file .env.production up -d --build
            bash scripts/deploy/run-migrations.sh
          REMOTE
      
      - name: Run health check
        run: |
          curl --retry 12 --retry-delay 5 --retry-connrefused -fsS https://skyait.skyraksys.com/health
      
      - name: Rollback on failure
        if: failure()
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
            set -euo pipefail
            previous=$(cat "$DEPLOY_PATH/backups/previous-release")
            ln -sfn "$previous" "$DEPLOY_PATH/current"
            cd "$DEPLOY_PATH/current"
            docker compose --env-file .env.production up -d
          REMOTE
  
  # Post-deployment monitoring
  post-deploy:
    name: Post-Deployment Monitoring
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    
    steps:
      - name: Check deployment status
        run: |
          if [ "${{ needs.deploy-staging.result }}" == "success" ] || [ "${{ needs.deploy-production.result }}" == "success" ]; then
            echo "✅ Deployment completed successfully"
          else
            echo "❌ Deployment failed"
            exit 1
          fi
      
      - name: Create GitHub Release (for tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
